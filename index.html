<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaarkring - الجمعية</title>

<link rel="stylesheet" href="style.css">

<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<!-- Main JS -->
<script src="monthly-codes.js" defer></script>
<script src="app.js" defer></script>

</head>
<body>
  <div class="container">
    <h1 onclick="toggleAdminView()">Spaarkring</h1>
    <div class="status-card">📢 القسط: 400 يورو | الموعد: 20 من الشهر</div>
    <h3 id="monthLabel">جارٍ الاتصال…</h3>
    <p>الكود يفعّل الشهر المحدد فقط، وينتهي ببداية الشهر التالي بتوقيت UTC.</p>
    <p id="summary" role="status"></p>

    <table>
      <thead><tr><th>الاسم</th><th>تفعيل الشهر</th><th>دفع القسط</th></tr></thead>
      <tbody id="memberTable"></tbody>
    </table>

    <div class="payout-container">
      <h3>💰 ترتيب استلام ٤٬٠٠٠ يورو</h3>
      <table>
        <thead><tr><th>الاسم</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="payoutTable"></tbody>
      </table>
    </div>

    <div id="adminPanel">
      <div id="loginForm">
        <h4 style="color:#c0392b;">دخول المسؤول</h4>
        <input type="email" id="email" placeholder="الإيميل" class="admin-input" autocomplete="off">
        <input type="password" id="pass" placeholder="كلمة المرور" class="admin-input" autocomplete="new-password">
        <button onclick="loginAdmin()" class="btn-reset">دخول</button>
      </div>
      <div id="adminControls" style="display:none;">
        <p style="color:#27ae60; font-weight:bold;">أهلاً يا محمد</p>
        <label for="codeMonth">شهر التفعيل</label>
        <input type="month" id="codeMonth" onchange="clearCodes()">
        <button id="issueCodes" onclick="issueCodes()" class="btn-reset">إصدار / عرض أكواد الشهر</button>
        <p>أرسل لكل عضو رسالته الخاصة. سجلات الأشهر السابقة تبقى محفوظة.</p>
        <div id="issuedCodes"></div>
        <button onclick="logoutAdmin()" style="background:#95a5a6;">خروج</button>
      </div>
    </div>
  </div>

  <div id="myAlert" class="custom-alert">
    <div class="alert-content">
      <p id="alertMsg"></p>
      <button onclick="closeAlert()" class="alert-btn">موافق</button>
    </div>
  </div>
</body>
</html>
